[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "isr-tools"
version = "0.1.0"
description = "ISR Studio: search and rescue triage, site security survey and art selection from UAV / drone photos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "pillow>=10.0", "scipy>=1.9"]

[project.optional-dependencies]
ai = ["ultralytics>=8.0"]
dev = ["pytest"]

[project.scripts]
isr = "isr.cli:main"
survey = "isr.cli:survey_main"
isr-studio = "isr.cli:app_main"

[tool.setuptools.packages.find]
include = ["isr*"]
